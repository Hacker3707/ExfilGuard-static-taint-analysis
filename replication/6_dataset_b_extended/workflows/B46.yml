name: B46-artifact-upload-secret-file

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET: "${{ secrets.TEST_SECRET }}"

    steps:
      - name: Write a log file
        run: |
          echo "token=$SECRET" > build.log

      - name: Upload the log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
